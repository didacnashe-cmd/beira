name: Test y deploy al VPS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # botón para desplegar a mano desde GitHub

concurrency: deploy-${{ github.repository }}-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: La imagen construye y arranca
        run: |
          docker build -t beira:ci .
          docker run -d --name beira-ci --network host beira:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8100/healthz && exit 0
            sleep 1
          done
          docker logs beira-ci
          exit 1

  deploy:
    needs: test             # si los tests fallan, no se despliega
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Unirse a Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Preparar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Desplegar
        run: ssh -p 2222 -o BatchMode=yes ubuntu@100.105.67.98 "${{ github.event.repository.name }}"
