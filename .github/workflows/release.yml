name: Publicar imagen en GHCR

# Solo con tags de versión. No toca el VPS: el despliegue sigue en deploy.yml.
# Para lanzarlo a mano, elige un tag (no una rama) en "Use workflow from".
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency: release-${{ github.ref }}

jobs:
  version:
    name: El tag coincide con VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comparar tag y beira/__init__.py
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Este workflow debe ejecutarse sobre un tag vX.Y.Z, no sobre '$GITHUB_REF_NAME'."
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          code="$(python3 -c 'import re,pathlib; print(re.search(r"^VERSION\s*=\s*[\"\x27]([^\"\x27]+)", pathlib.Path("beira/__init__.py").read_text(), re.M).group(1))')"
          echo "tag=$tag  VERSION=$code"
          if [ "$tag" != "$code" ]; then
            echo "::error::El tag v$tag no coincide con VERSION=$code de beira/__init__.py."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  publish:
    needs: [version, test]   # sin versión correcta y tests en verde no se publica
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/beira
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Beira
            org.opencontainers.image.description=Proxy MCP que re-expone un MCP local a contactos, con permisos.

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
